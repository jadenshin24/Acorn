<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Acorn Search - 간단하고 빠른 웹 검색 홈페이지" />
    <title>Acorn Search</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #202124;
        --muted: #5f6368;
        --line: #dfe1e5;
        --line-strong: #c6c9ce;
        --shadow: rgba(32, 33, 36, 0.12);
        --green: #3d8b3d;
        --green-dark: #2d6d2d;
        --acorn: #7b9a5d;
        --acorn-deep: #5a7d3a;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 24px 16px 20px;
        overflow-x: hidden;
      }

      .page {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo-wrap {
        margin-bottom: 28px;
        text-align: center;
      }

      .logo {
        font-size: clamp(2.2rem, 4.2vw, 4.2rem);
        line-height: 1.1;
        letter-spacing: -0.06em;
        font-weight: 700;
        user-select: none;
      }

      .logo .acorn {
        color: var(--green);
      }

      .logo .acorn::before {
        content: "";
        display: inline-block;
        width: 0.2em;
        height: 0.2em;
        margin-right: 0.1em;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--acorn), var(--acorn-deep));
        vertical-align: middle;
        transform: translateY(-0.08em);
      }

      .logo .search {
        color: #343a40;
      }

      .search-panel {
        width: min(100%, 640px);
      }

      form {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
      }

      .search-box {
        position: relative;
        flex: 1;
      }

      .search-input {
        width: 100%;
        height: 54px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        padding: 0 18px 0 52px;
        font-size: 1.02rem;
        color: var(--text);
        outline: none;
        transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        appearance: none;
        -webkit-appearance: none;
      }

      .search-input::placeholder {
        color: var(--muted);
      }

      .search-input:focus {
        border-color: rgba(93, 156, 90, 0.5);
        box-shadow: 0 0 0 4px rgba(93, 156, 90, 0.12), 0 8px 18px rgba(31, 41, 55, 0.08);
      }

      .search-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 20px;
        color: var(--muted);
        pointer-events: none;
      }

      .search-button {
        min-width: 128px;
        height: 54px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--green), var(--acorn-deep));
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        padding: 0 22px;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(61, 139, 61, 0.18);
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      }

      .search-button:hover,
      .search-button:active {
        transform: translateY(-1px);
        box-shadow: 0 10px 18px rgba(61, 139, 61, 0.2);
        filter: brightness(1.02);
      }

      .search-button:active {
        transform: translateY(0);
      }

      footer {
        margin-top: 34px;
        color: var(--muted);
        font-size: 0.92rem;
        letter-spacing: 0.01em;
        user-select: none;
      }

      @media (max-width: 560px) {
        body {
          padding-left: 14px;
          padding-right: 14px;
        }

        .search-panel {
          width: min(100%, 100%);
        }

        form {
          flex-direction: column;
          gap: 14px;
        }

        .search-box,
        .search-button {
          width: 100%;
        }

        .search-button {
          min-width: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="logo-wrap" aria-label="Acorn Search logo">
        <div class="logo"><span class="acorn">Acorn</span> <span class="search">Search</span></div>
      </div>

      <div class="search-panel">
        <form id="searchForm" action="#" method="get" autocomplete="off" novalidate>
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="6"></circle>
              <line x1="16" y1="16" x2="21" y2="21"></line>
            </svg>
            <input
              id="searchInput"
              class="search-input"
              type="text"
              name="q"
              placeholder="검색어를 입력하세요"
              aria-label="검색어"
              autofocus
              enterkeyhint="search"
            />
          </div>
          <button class="search-button" type="submit">Acorn 검색</button>
        </form>
      </div>

      <footer aria-label="copyright">© 2026 Acorn</footer>
    </div>

    <script>
      const form = document.getElementById('searchForm');
      const input = document.getElementById('searchInput');

      function normalizeUrl(value) {
        const trimmed = value.trim();
        if (!trimmed) return '';

        if (/^https?:\/\//i.test(trimmed)) {
          return trimmed;
        }

        if (/^[a-z0-9.-]+\.[a-z]{2,}([/?#].*)?$/i.test(trimmed)) {
          return 'https://' + trimmed;
        }

        return 'https://' + trimmed;
      }

      function isLikelyUrl(value) {
        const trimmed = value.trim();
        if (!trimmed) return false;

        const hasScheme = /^https?:\/\//i.test(trimmed);
        const looksLikeDomain = /^[a-z0-9.-]+\.[a-z]{2,}([/?#].*)?$/i.test(trimmed);
        const looksLikeLocalUrl = /^(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)?(\/.*)?$/i.test(trimmed);

        return hasScheme || looksLikeDomain || looksLikeLocalUrl;
      }

      function performSearch() {
        const raw = input.value;
        const query = raw.trim();

        if (!query) {
          input.focus();
          return;
        }

        if (isLikelyUrl(query)) {
          const url = normalizeUrl(query);
          window.location.href = url;
          return;
        }

        const googleUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query);
        window.location.href = googleUrl;
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        performSearch();
      });

      input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          performSearch();
        }
      });

      window.addEventListener('load', function () {
        input.focus();
      });
    </script>
  </body>
</html>
